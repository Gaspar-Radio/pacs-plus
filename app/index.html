<style>
:root{--bg:#f1f5f9;--card:#fff;--tx:#0f172a;--mut:#64748b;--ln:#e2e8f0;--pri:#2563eb;--ok:#059669;--okbg:#ecfdf5;--wa:#d97706;--wabg:#fefce8;--er:#e11d48;--erbg:#fff1f2;--cn:#94a3b8;--chip:#e2e8f0}
@media (prefers-color-scheme:dark){:root{--bg:#0b1220;--card:#162033;--tx:#e2e8f0;--mut:#94a3b8;--ln:#24324a;--pri:#60a5fa;--ok:#34d399;--okbg:#0d2e25;--wa:#fbbf24;--wabg:#2e2408;--er:#fb7185;--erbg:#33121c;--cn:#64748b;--chip:#24324a}}

html,body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.35 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif}

button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input,select{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--ln);border-radius:10px;padding:11px 12px;width:100%}

h2{font-size:13px;text-transform:uppercase;letter-spacing:.04em;color:var(--mut);margin:16px 4px 6px;display:flex;justify-content:space-between}
.per{display:flex;justify-content:space-between;align-items:center;width:100%;margin:12px 0 8px;padding:12px 14px;border-radius:12px;color:#fff;font-weight:800;font-size:15px;text-align:left}

.card{background:var(--card);border:1px solid var(--ln);border-radius:14px;padding:10px 12px;margin-bottom:8px}

.tag.urg{background:#dc2626;color:#fff}.tag.pref{background:#dbeafe;color:#1e40af}.tag.part{background:#fae8ff;color:#86198f}.tag.sus{background:#fee2e2;color:#991b1b}.tag.enc{background:#fef3c7;color:#92400e}
@media (prefers-color-scheme:dark){.tag.pref{background:#1e3a8a;color:#bfdbfe}.tag.part{background:#581c87;color:#f5d0fe}.tag.sus{background:#7f1d1d;color:#fecaca}.tag.enc{background:#78350f;color:#fde68a}}

.acts{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-top:9px}

.b.on-chegou{background:#fde68a;color:#713f12;border-color:#f59e0b}

.kpis{display:grid;grid-template-columns:1fr 1fr;gap:8px}

.bar{height:7px;border-radius:4px;background:var(--chip);margin-top:4px;overflow:hidden}.bar i{display:block;height:100%;background:var(--er)}

.login{max-width:420px;margin:40px auto;padding:0 18px}

/* v1.4.0 — saídas, anotações, gestão (vagas / financeiro) */
.per.s{background:#64748b}
textarea{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--ln);border-radius:10px;padding:10px 12px;width:100%;margin-top:8px;resize:vertical}
.tag.nota{background:#fef3c7;color:#92400e}@media (prefers-color-scheme:dark){.tag.nota{background:#422006;color:#fde68a}}
.nota{background:var(--bg);border:1px solid var(--ln);border-radius:10px;padding:8px 30px 8px 10px;margin-bottom:6px;font-size:14px;position:relative}.nota small{display:block;color:var(--mut);font-size:11px}
.ndel{position:absolute;right:4px;top:4px;color:var(--mut);padding:4px 8px}
.nchips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.nchip{border:1px solid var(--ln);border-radius:999px;padding:6px 10px;font-size:13px;font-weight:600;background:var(--card)}
.nchip.on{background:var(--pri);color:#fff;border-color:var(--pri)}.nchip.sa.on{background:#b45309;border-color:#b45309}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:var(--chip);border-radius:12px;padding:3px;margin:6px 0 10px}.seg.u6{grid-template-columns:repeat(6,1fr)}.seg.u3{grid-template-columns:repeat(3,1fr)}
.seg button{padding:8px 2px;border-radius:9px;font-size:13px;font-weight:700;color:var(--mut)}.seg button.on{background:var(--card);color:var(--tx);box-shadow:0 1px 3px rgba(0,0,0,.15)}
.navp{display:flex;align-items:center;gap:8px;margin:0 0 8px}.navp b{flex:1;text-align:center;font-size:15px}.navp button{width:40px;height:36px;border-radius:10px;background:var(--card);border:1px solid var(--ln);font-size:18px}
.kpi small{display:block;font-size:11px;color:var(--mut);margin-top:2px}
.sbar{display:flex;gap:2px;height:24px;margin:6px 0}.sbar i{display:block;border-radius:4px;min-width:3px;color:#fff;font-size:11px;font-weight:700;line-height:24px;padding-left:5px;font-style:normal;white-space:nowrap}
.leg{display:flex;flex-wrap:wrap;gap:10px;font-size:12px;color:var(--mut)}.leg span i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:4px;vertical-align:-1px}
.lst{margin:0;padding-left:18px;font-size:14px}.lst li{margin:4px 0}
.tbl.sm{font-size:13px}.tbl.sm td,.tbl.sm th{padding:6px 4px}

<body>
<div id="app"></div>
<div class="sheetbg" id="sheetbg"></div>
<div class="sheet" id="sheet"></div>
<div class="toast" id="toast"></div>
<script>
'use strict';
// =====================================================================
// Agenda US — app web (PWA) para iPhone sobre o mesmo Supabase da Agenda.
// NADA de endereço do banco, chave ou dado de paciente no código: o endereço
// e a chave pública são digitados uma vez no aparelho; os dados só chegam
// com login (RLS = authenticated). Grava com PATCH por id (só os campos da
// ação), para não sobrescrever o que os PCs/integração PACS gravaram.
// =====================================================================
const VERSAO = '1.4.0';
const K = { cfg: 'agapp_cfg_v1', ses: 'agapp_sessao_v1', cache: 'agapp_cache_v1', fila: 'agapp_fila_v1', tab: 'agapp_tab_v1', gest: 'agapp_gestao_v1' };
const TABELA = 'agenda_exames';
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const ls = { get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } }, set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* cheio */ } }, del(k) { try { localStorage.removeItem(k); } catch (e) { /* ok */ } } };
const pad = n => String(n).padStart(2, '0');
const isoDia = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const hojeIso = () => isoDia(new Date());
const DIAS = ['dom', 'seg', 'ter', 'qua', 'qui', 'sex', 'sáb'];
const fmtDia = iso => { const [y, m, d] = iso.split('-').map(Number); const dt = new Date(y, m - 1, d); return `${DIAS[dt.getDay()]} ${pad(d)}/${pad(m)}`; };
const somaDias = (iso, n) => { const [y, m, d] = iso.split('-').map(Number); return isoDia(new Date(y, m - 1, d + n)); };
const hm = iso => { if (!iso) return '--:--'; const d = new Date(iso); return isNaN(d) ? '--:--' : `${pad(d.getHours())}:${pad(d.getMinutes())}`; };
const normTime = h => { const p = String(h || '').trim().replace(/[hH.]/g, ':').split(':'); return `${(p[0] || '0').replace(/\D/g, '').padStart(2, '0').slice(-2)}:${(p[1] || '00').replace(/\D/g, '').padEnd(2, '0').slice(0, 2)}`; };
const normText = s => String(s == null ? '' : s).replace(/\s+/g, ' ').trim().toUpperCase();
const normName = s => String(s == null ? '' : s).normalize('NFD').replace(/[̀-ͯ]/g, '').toUpperCase().replace(/[^A-Z ]/g, ' ').replace(/\s+/g, ' ').trim();
const minutos = (a, b) => { if (!a) return null; const d = ((b ? new Date(b) : new Date()) - new Date(a)); return d < 0 ? 0 : Math.floor(d / 60000); };
const fmtMin = m => m == null || isNaN(m) ? '–' : m < 60 ? `${m}m` : `${Math.floor(m / 60)}h${pad(m % 60)}`;
const slaCls = m => m == null ? '' : m >= 60 ? 's60' : m >= 45 ? 's45' : m >= 30 ? 's30' : '';
const proc = r => Math.max(r.qtd_exames || 1, r.pacs_qtd_exames || 1);
const chavePac = r => r.pacs_paciente_id > 0 ? 'p' + r.pacs_paciente_id : 'n' + normName(r.paciente);
function normConvenio(c) {
    const u = normText(c).normalize('NFD').replace(/[̀-ͯ]/g, '');
    if (!u) return 'NÃO INFORMADO';
    if (u.startsWith('PREFEITURA')) return 'PREFEITURA';
    if (/^SUS\b/.test(u)) return normText(c);
    if (/^SER[PF][A-Z]*([ -]|$)/.test(u)) return 'SERPRAM';
    if (/^IPSEN?MG/.test(u)) return 'IPSEMG';
    if (/^IPSM/.test(u)) return 'IPSM (PM)';
    if (/^UNIMED INTERC/.test(u)) return 'UNIMED INTERCÂMBIO';
    if (/^UNIMED( SUL.*)?$/.test(u)) return 'UNIMED SUL MINEIRA';
    if (/^SPA SAUDE/.test(u)) return 'SPA SAÚDE';
    if (/^BRADESCO/.test(u)) return 'BRADESCO';
    if (/^CARTAO DESC/.test(u)) return 'CARTÃO DESCONTO';
    return normText(c);
}
function toast(t, ms = 2600) { const el = $('#toast'); el.textContent = t; el.style.display = 'block'; clearTimeout(toast.t); toast.t = setTimeout(() => { el.style.display = 'none'; }, ms); }

// ---------------------------------------------------------------- estado
const S = { tab: ls.get(K.tab, 'agenda'), dia: hojeIso(), linhas: [], carregando: false, erro: '', rt: 'off', ultima: 0, per: { m: false, t: false, s: false }, gest: ls.get(K.gest, 'faltas'), nota: null }; // per: períodos começam recolhidos
// v1.4.0 — saída = desmarcou/cancelado, ou saiu da planilha/PACS sem chegar (mesma regra dos PCs): sai da agenda do período e libera a vaga
const ehSaida = r => r.status === 'cancelado' || (!!r.removido_origem_em && (!r.status || r.status === 'pendente'));
const notasDe = r => (Array.isArray(r && r.notas) ? r.notas : []);
const NOTA_TAGS = ['Intercorrência', 'Saída', 'Preparo', 'Contato', 'Pendência', 'Outra'];
const SAIDA_MOTIVOS = ['Desmarcou', 'Remanejado', 'Convênio não autorizou', 'Desistiu / foi embora', 'Sem preparo', 'Exame não indicado', 'Duplicado', 'Outro'];
const motivoSaida = r => { const n = [...notasDe(r)].reverse().find(x => x.tag === 'Saída'); return n ? n.motivo || '' : ''; };

// ---------------------------------------------------------------- configuração e sessão
function cfg() { const c = ls.get(K.cfg, null); return c && c.url && c.key ? c : null; }
function salvarCfg(url, key) {
    let u = String(url || '').trim().replace(/^["']|["']$/g, '');
    if (u && !/^https?:\/\//i.test(u)) u = 'https://' + u;
    try { u = new URL(u).origin; } catch (e) { throw new Error('Endereço do projeto inválido.'); }
    const k = String(key || '').replace(/\s+/g, '');
    if (!k) throw new Error('Informe a chave pública (publishable/anon).');
    ls.set(K.cfg, { url: u, key: k });
}
function sessao() { return ls.get(K.ses, null); }
function gravarSessao(j) { const s = { access_token: j.access_token, refresh_token: j.refresh_token, expires_at: j.expires_at || Math.floor(Date.now() / 1000) + (j.expires_in || 3600), email: (j.user && j.user.email) || (sessao() || {}).email || '' }; ls.set(K.ses, s); return s; }
async function authPost(caminho, corpo) {
    const c = cfg();
    const r = await fetch(`${c.url}/auth/v1/${caminho}`, { method: 'POST', headers: { apikey: c.key, 'content-type': 'application/json' }, body: JSON.stringify(corpo) });
    let j = {}; try { j = await r.json(); } catch (e) { /* vazio */ }
    return { status: r.status, json: j };
}
async function entrar(email, senha) {
    const r = await authPost('token?grant_type=password', { email: String(email || '').trim(), password: String(senha || '') });
    if (r.status === 200 && r.json.access_token) return gravarSessao(r.json);
    const cod = r.json.error_code || r.json.error || '';
    if (cod === 'invalid_credentials' || cod === 'invalid_grant') throw new Error('E-mail ou senha incorretos.');
    throw new Error(`Login recusado (HTTP ${r.status}).`);
}
let renovando = null;
function renovar() {
    if (renovando) return renovando;
    renovando = (async () => {
        const s = sessao(); if (!s) return null;
        const r = await authPost('token?grant_type=refresh_token', { refresh_token: s.refresh_token });
        if (r.status === 200 && r.json.access_token) { const n = gravarSessao(r.json); rtToken(n.access_token); return n; }
        if (r.status === 400 || r.status === 401 || r.status === 403) { sair(true); throw new Error('Sessão encerrada. Entre de novo.'); }
        throw new Error(`HTTP ${r.status} ao renovar a sessão`);
    })().finally(() => { renovando = null; });
    return renovando;
}
async function token() {
    let s = sessao(); if (!s) throw new Error('sem login');
    if (s.expires_at - Date.now() / 1000 < 300) s = await renovar();
    if (!s) throw new Error('sem login');
    return s.access_token;
}
function sair(silencioso) {
    const s = sessao(), c = cfg();
    if (s && c) fetch(`${c.url}/auth/v1/logout`, { method: 'POST', headers: { apikey: c.key, Authorization: 'Bearer ' + s.access_token } }).catch(() => {});
    ls.del(K.ses); ls.del(K.cache); ls.del(K.fila);
    S.linhas = [];
    rtFechar();
    if (!silencioso) toast('Sessão encerrada e dados locais apagados.');
    render();
}

// ---------------------------------------------------------------- REST
async function api(caminho, metodo = 'GET', corpo, prefer, tentativa = 1) {
    const c = cfg(); if (!c) throw new Error('App não configurado');
    const h = { apikey: c.key, Authorization: 'Bearer ' + await token(), 'content-type': 'application/json' };
    if (prefer) h.Prefer = prefer;
    let r;
    try { r = await fetch(`${c.url}/rest/v1/${caminho}`, { method: metodo, headers: h, body: corpo ? JSON.stringify(corpo) : undefined }); }
    catch (e) { const er = new Error('Sem conexão'); er.rede = true; throw er; }
    if (r.status === 401 && tentativa === 1) { await renovar(); return api(caminho, metodo, corpo, prefer, 2); }
    const txt = await r.text();
    let j = null; try { j = txt ? JSON.parse(txt) : null; } catch (e) { j = txt; }
    if (!r.ok) { const er = new Error((j && (j.message || j.msg)) || `HTTP ${r.status}`); er.status = r.status; er.code = j && j.code; throw er; }
    return j;
}

// ---------------------------------------------------------------- fila offline (ações feitas sem rede)
function fila() { return ls.get(K.fila, []); }
function enfileirar(op) { const f = fila().filter(o => !(o.t === 'patch' && op.t === 'patch' && o.id === op.id)); if (op.t === 'patch') { const ant = fila().find(o => o.t === 'patch' && o.id === op.id); if (ant) op.campos = Object.assign({}, ant.campos, op.campos); } f.push(op); ls.set(K.fila, f); }
let enviando = false;
async function enviarFila() {
    if (enviando || !fila().length || !sessao()) return;
    enviando = true;
    try {
        while (fila().length) {
            const op = fila()[0];
            if (op.t === 'patch') await api(`${TABELA}?id=eq.${op.id}`, 'PATCH', op.campos, 'return=minimal');
            else if (op.t === 'insert') { try { await api(TABELA, 'POST', op.linha, 'return=minimal'); } catch (e) { if (e.status !== 409) throw e; } }
            else if (op.t === 'delete') await api(`${TABELA}?id=eq.${op.id}`, 'DELETE', null, 'return=minimal');
            ls.set(K.fila, fila().slice(1));

async function carregarDia(dia = S.dia, silencioso) {

    try {
        await enviarFila();
        const d = await api(`${TABELA}?data_agenda=eq.${dia}&select=*&order=hora.asc,id.asc`);
        if (dia !== S.dia) return;
        // ações ainda na fila prevalecem sobre a leitura

        S.linhas = (d || []).map(r => pend[r.id] ? Object.assign({}, r, pend[r.id]) : r);
        S.erro = ''; S.ultima = Date.now();
        const cache = ls.get(K.cache, {}); cache[dia] = S.linhas;
        const dias = Object.keys(cache).sort(); while (dias.length > 7) delete cache[dias.shift()]; // guarda só os últimos dias abertos

}

const RT = { ws: null, ref: 0, hb: null, retry: 0, timer: null, last: 0, join: null, deb: null };
const RT_TOPIC = 'realtime:agenda-app';
function rtSend(o) { try { if (RT.ws && RT.ws.readyState === 1) RT.ws.send(JSON.stringify(o)); } catch (e) { /* ok */ } }
async function rtConectar() {
    const c = cfg(); if (!c || !sessao() || document.hidden) return;
    if (RT.ws && RT.ws.readyState <= 1) return;
    clearTimeout(RT.timer);
    let tk; try { tk = await token(); } catch (e) { return; }
    const ws = new WebSocket(`${c.url.replace(/^http/i, 'ws')}/realtime/v1/websocket?apikey=${encodeURIComponent(c.key)}&vsn=1.0.0`);
    RT.ws = ws; S.rt = 'conectando'; pintarSync();
    ws.onopen = () => {
        RT.last = Date.now(); RT.join = String(++RT.ref);
        rtSend({ topic: RT_TOPIC, event: 'phx_join', ref: RT.join, join_ref: RT.join, payload: { access_token: tk, config: { broadcast: { self: false }, presence: { key: '' }, postgres_changes: [{ event: '*', schema: 'public', table: TABELA }] } } });
        clearInterval(RT.hb);
        RT.hb = setInterval(() => { if (Date.now() - RT.last > 75000) { try { ws.close(); } catch (e) { /* ok */ } return; } rtSend({ topic: 'phoenix', event: 'heartbeat', payload: {}, ref: String(++RT.ref) }); }, 25000);
    };
    ws.onmessage = ev => {
        RT.last = Date.now();
        let m; try { m = JSON.parse(ev.data); } catch (e) { return; }
        if (!m || m.topic !== RT_TOPIC) return;
        if (m.event === 'phx_reply' && m.ref === RT.join) { if (m.payload && m.payload.status === 'ok') { S.rt = 'on'; RT.retry = 0; } else { S.rt = 'falhou'; try { ws.close(); } catch (e) { /* ok */ } } pintarSync(); return; }
        if (m.event === 'postgres_changes') {
            const d = m.payload && m.payload.data; if (!d) return;
            const rec = d.record || d.old_record || {};
            if (d.type === 'DELETE' || !rec.data_agenda || rec.data_agenda === S.dia) { clearTimeout(RT.deb); RT.deb = setTimeout(() => carregarDia(S.dia, true), 900); }
        }
        if (m.event === 'phx_error' || m.event === 'phx_close') { try { ws.close(); } catch (e) { /* ok */ } }
    };
    ws.onclose = () => { if (RT.ws === ws) { RT.ws = null; clearInterval(RT.hb); } if (S.rt !== 'falhou') S.rt = 'off'; pintarSync(); if (sessao() && !document.hidden) { RT.timer = setTimeout(rtConectar, Math.min(300000, 3000 * Math.pow(2, RT.retry++))); } };
}
function rtToken(tk) { if (S.rt === 'on') rtSend({ topic: RT_TOPIC, event: 'access_token', payload: { access_token: tk }, ref: String(++RT.ref) }); }
function rtFechar() { clearTimeout(RT.timer); clearInterval(RT.hb); if (RT.ws) { const w = RT.ws; RT.ws = null; try { w.close(); } catch (e) { /* ok */ } } S.rt = 'off'; }

        if (atual && FMU[F.un] && !falta.length) { let ate = 0, tot = 0; for (let d = isoD(per.ini); isoDia(d) <= per.fim; d.setDate(d.getDate() + 1)) { const w = d.getDay(); if (w > 0 && w < 6) { tot++; if (isoDia(d) <= hoje) ate++; } } if (ate && A.v) proj = A.v / ate * tot; }
        const dlt = B && B.n && B.v ? (A.v - B.v) / B.v * 100 : null, rt = r.fixos && r.fixos.RT, nM = FMU[F.un] || 0;
        // série: por dia (semana/mês), por semana (tri) ou por mês (semestre/ano)
        const porMes = F.un === 'sem' || F.un === 'ano', porSem = F.un === 'tri';
        const chave = s => (porMes ? s.slice(0, 7) : porSem ? isoDia((d => new Date(d.getFullYear(), d.getMonth(), d.getDate() - ((d.getDay() + 6) % 7)))(isoD(s))) : s.slice(0, 10));
        const bk = new Map();
        if (F.un !== 'dia') for (let d = isoD(per.ini); isoDia(d) <= per.fim; d.setDate(d.getDate() + 1)) { const k = chave(isoDia(d)); if (!bk.has(k)) bk.set(k, { k, lib: 0, pend: 0 }); }
        filt(r.serie).forEach(x => { const e = bk.get(chave(String(x.dia))); if (e) { e.lib += +x.lib_valor || 0; e.pend += +x.pend_valor || 0; } });
        const arr = [...bk.values()], max = Math.max(1, ...arr.map(x => x.lib + x.pend)), W = Math.max(300, (tela.clientWidth || 360) - 26), H = 120, slot = W / Math.max(arr.length, 1), bw = Math.min(slot * 0.7, 18);
        const yv = v => (H - 16) * v / max;
        const graf = arr.length > 1 ? `<div class="card"><svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block">${arr.map((x, i) => { const cx = slot * (i + 0.5), hl = yv(x.lib), hp = yv(x.pend), y0 = H - 14; return `<g><title>${porMes ? MESES[+x.k.slice(5, 7) - 1] : x.k.split('-').reverse().slice(0, 2).join('/')}: liberado ${brl(x.lib)} · não liberado ${brl(x.pend)}</title>${hl > 0.5 ? `<rect x="${(cx - bw / 2).toFixed(1)}" y="${(y0 - hl).toFixed(1)}" width="${bw.toFixed(1)}" height="${hl.toFixed(1)}" rx="2" fill="#059669"/>` : ''}${hp > 0.5 ? `<rect x="${(cx - bw / 2).toFixed(1)}" y="${(y0 - hl - hp).toFixed(1)}" width="${bw.toFixed(1)}" height="${Math.max(hp - 2, 0.5).toFixed(1)}" rx="2" fill="#d97706"/>` : ''}${i % Math.ceil(arr.length / 8) === 0 ? `<text x="${cx.toFixed(1)}" y="${H - 2}" font-size="10" text-anchor="middle" fill="#94a3b8">${porMes ? MESES[+x.k.slice(5, 7) - 1].slice(0, 3) : x.k.slice(8, 10)}</text>` : ''}</g>`; }).join('')}</svg>
<div class="leg"><span><i style="background:#059669"></i>Liberado</span><span><i style="background:#d97706"></i>Não liberado (revisão + a laudar)</span></div></div>` : '';
        const junta = (lst, kf) => { const m = new Map(); lst.forEach(x => { const k = kf(x), e = m.get(k); if (!e) m.set(k, Object.assign({}, x)); else ['n', 'valor', 'lib_valor', 'sem_n', 'est_n'].forEach(c => { e[c] = (+e[c] || 0) + (+x[c] || 0); }); }); return [...m.values()].sort((a, b) => b.valor - a.valor || b.n - a.n); };
        const cats = junta(filt(r.por_categoria), x => x.cat), convs = junta(filt(r.por_convenio), x => x.conv).slice(0, 25), grupos = [...filt(r.por_grupo)].sort((a, b) => b.valor - a.valor);
        const semT = filt(r.sem_tarifa).reduce((a, x) => a + x.n, 0);
        const lm = (nome, m) => `<tr><td>${nome}</td><td class="num">${m.liberado.n}<br><small>${brl(m.liberado.v)}</small></td><td class="num">${m.revisar.n}<br><small>${brl(m.revisar.v)}</small></td><td class="num">${m.pendente.n}<br><small>${brl(m.pendente.v)}</small></td></tr>`;
        tela.innerHTML = `<main>${topo}
${falta.length ? `<div class="card" style="background:var(--wabg)">⚠ Sem leitura do PACS: <b>${falta.map(m => `${MESES[+m.mes.slice(5) - 1]}/${m.mes.slice(0, 4)}`).join(', ')}</b> — abra o 💰 Financeiro num computador com o PACS logado e toque em 🔄 Ler do PACS.</div>` : ''}
<div class="kpis"><div class="kpi"><b>${brl(A.liberado.v)}</b><span>✅ Liberado</span><small>${nBR(A.liberado.n)} laudos</small></div>
<div class="kpi"><b>${brl(A.revisar.v)}</b><span>📝 Em revisão</span><small>${nBR(A.revisar.n)} exames</small></div>
<div class="kpi"><b>${brl(A.pendente.v)}</b><span>⏳ A laudar</span><small>${nBR(A.pendente.n)} exames</small></div>
<div class="kpi"><b>${brl(A.v)}</b><span>Σ Produção</span><small>${nBR(A.n)} exames${A.semN ? ` · ${A.semN} sem tarifa` : ''}</small></div>
<div class="kpi"><b>${brl(A.ticket)}</b><span>Ticket médio</span><small>${A.est ? `inclui ${brl(A.est)} estimado` : 'valores conferidos'}</small></div>
<div class="kpi"><b>${nBR(A.urgN)}</b><span>🚨 Urgências</span><small>${brl(A.urgV)} · ${nBR(A.intN)} internados</small></div>
<div class="kpi"><b>${proj ? brl(proj) : '—'}</b><span>📈 Projeção</span><small>${proj ? 'no ritmo dos dias úteis' : atual ? 'mês, tri, semestre ou ano' : 'período encerrado'}</small></div>
<div class="kpi"><b>${rt ? brl(rt.valor) : '—'}</b><span>RT fixo/mês (à parte)</span><small>${rt && nM > 1 ? `${nM} meses = ${brl(rt.valor * nM)}` : 'fora da produção'}</small></div></div>
<div class="note" style="margin-top:8px">${dlt != null ? `<b style="color:${dlt >= 0 ? 'var(--ok)' : 'var(--er)'}">${dlt >= 0 ? '▲ +' : '▼ −'}${Math.abs(dlt).toFixed(1).replace('.', ',')}%</b> vs ${atual ? 'mesmo ponto de ' : ''}${esc(ant.rot)} (${brl(B.v)}) · ` : ''}${mesesP.length && mesesP.length <= 2 ? mesesP.map(m => `lido do PACS: US ${idade(m.lido && m.lido.US)} · TC ${idade(m.lido && m.lido.CT)}`).join(' — ') : ''}</div>
${graf}
<h2><span>Por modalidade e situação</span></h2><table class="tbl sm"><tr><th>Mod.</th><th class="num">Liberado</th><th class="num">Revisão</th><th class="num">A laudar</th></tr>${['US', 'CT'].filter(k => A.pm[k]).map(k => lm(k === 'US' ? '🔊 US' : '🩻 TC', A.pm[k])).join('')}</table>

<div class="note">${semT ? `⚠ ${semT} exame(s) sem tarifa ficaram fora do total. ` : ''}≈ = valor estimado. Produção pela data do exame, lida do PACS pelos computadores (a cada ~30 min com o PACS aberto) × tabela de tarifas privada do banco (versão corrigida). Repasse estimado — o pagamento real depende do fechamento e das glosas.</div></main>`;

// v1.2.0 — 📝 Laudos pendentes (US e TC): tabela laudos_pendentes, alimentada pelo PACS Plus dos computadores (só números/datas)
async function telaLaudos() {
    const tela = $('#tela'); tela.innerHTML = '<main><div class="vazio">Carregando…</div></main>';
    try {
        const rows = await api('laudos_pendentes?select=*');
        if (S.tab !== 'laudos') return;
        const dm = iso => { const m = String(iso || '').match(/^(\d{4})-(\d{2})-(\d{2})/); return m ? `${m[3]}/${m[2]}` : '—'; };
        const sem = iso => { const m = String(iso || '').match(/^(\d{4})-(\d{2})-(\d{2})/); return m ? ['dom', 'seg', 'ter', 'qua', 'qui', 'sex', 'sáb'][new Date(+m[1], m[2] - 1, +m[3]).getDay()] : ''; };
        const hojeK = hojeIso();
        const bloco = m => {
            const r = (rows || []).find(x => x.modalidade === m), nome = m === 'US' ? '🔊 Ultrassom' : '🩻 Tomografia';
            if (!r) return `<h2><span>${nome}</span></h2><div class="vazio">Sem dados ainda — abra o PACS num computador com o PACS Plus 1.37+.</div>`;
            const idade = Math.round((Date.now() - new Date(r.atualizado_em).getTime()) / 60000);
            const quando = idade < 1 ? 'agora' : idade < 120 ? `há ${idade} min` : new Date(r.atualizado_em).toLocaleString('pt-BR', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' });
            const linhas = (r.por_dia || []).map(e => { const venc = e.venc || e.prazo < hojeK, hoje = !venc && e.prazo === hojeK;
                return `<tr style="${venc ? 'background:var(--erbg);font-weight:700' : hoje ? 'background:var(--wabg);font-weight:700' : ''}"><td>${venc ? '⚠ venceu' : hoje ? 'HOJE' : ''} ${sem(e.prazo)} ${dm(e.prazo)}</td><td class="num"><b>${e.n}</b></td><td class="num" style="color:var(--mut)">${e.rev || 0}/${e.dig || 0}</td><td style="color:var(--mut)">${dm(e.d0)}${e.d1 && e.d1 !== e.d0 ? '–' + dm(e.d1) : ''}</td></tr>`; }).join('');
            return `<h2><span>${nome}</span></h2><div class="kpis"><div class="kpi"><b>${r.total}</b><span>pendentes</span></div><div class="kpi"><b style="color:${r.vencidos ? 'var(--er)' : 'inherit'}">${r.vencidos}</b><span>vencidos</span></div><div class="kpi"><b style="color:${r.hoje ? 'var(--wa)' : 'inherit'}">${r.hoje}</b><span>vencem hoje</span></div><div class="kpi"><b style="font-size:15px;color:${idade > 30 ? 'var(--er)' : 'inherit'}">${quando}</b><span>atualizado${r.pc ? ' · ' + esc(r.pc) : ''}</span></div></div>
${linhas ? `<table class="tbl"><tr><th>Prazo</th><th class="num">Laudos</th><th class="num">Rev/Dig</th><th>Exames de</th></tr>${linhas}</table>` : '<div class="vazio">Nenhum laudo pendente ✓</div>'}`;
        };
        tela.innerHTML = `<main>${bloco('US')}${bloco('CT')}<div class="note">Revisar + Digitado, eletivos (sem urgentes). Prazo: US 3 e TC 5 dias úteis desde o exame (feriados fora). Atualiza a cada 10 min enquanto algum computador estiver com o PACS aberto e logado. Puxe para baixo ou toque na aba de novo para reler.</div></main>`;
        clearTimeout(S.lpT); S.lpT = setTimeout(() => { if (S.tab === 'laudos' && !document.hidden) telaLaudos(); }, 60000);
    } catch (e) { tela.innerHTML = `<main><div class="vazio">Erro: ${esc(e.message)}</div></main>`; }

function ligarLogin() {
    const f = $('#flog');
    const tr = $('#trocar'); if (tr) tr.onclick = () => { ls.del(K.cfg); render(); };
    f.onsubmit = async e => {
        e.preventDefault(); const m = $('#lmsg'); m.textContent = '';
        try {
            if (!cfg()) salvarCfg(f.url.value, f.key.value);
            await entrar(f.email.value, f.senha.value);
            render(); carregarDia(S.dia); rtConectar();
        } catch (er) { m.textContent = er.message || String(er); }
    };

$('#sheetbg').onclick = fecharSheet;
document.addEventListener('visibilitychange', () => {
    if (document.hidden) { rtFechar(); return; }
