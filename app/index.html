<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Agenda US">

<meta name="robots" content="noindex, nofollow">
<title>Agenda US</title>
<link rel="manifest" href="manifest.webmanifest">

<style>
:root{--bg:#f1f5f9;--card:#fff;--tx:#0f172a;--mut:#64748b;--ln:#e2e8f0;--pri:#2563eb;--ok:#059669;--okbg:#ecfdf5;--wa:#d97706;--wabg:#fefce8;--er:#e11d48;--erbg:#fff1f2;--cn:#94a3b8;--chip:#e2e8f0}
@media (prefers-color-scheme:dark){:root{--bg:#0b1220;--card:#162033;--tx:#e2e8f0;--mut:#94a3b8;--ln:#24324a;--pri:#60a5fa;--ok:#34d399;--okbg:#0d2e25;--wa:#fbbf24;--wabg:#2e2408;--er:#fb7185;--erbg:#33121c;--cn:#64748b;--chip:#24324a}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.35 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif}
body{padding-bottom:calc(64px + env(safe-area-inset-bottom))}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input,select{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--ln);border-radius:10px;padding:11px 12px;width:100%}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(env(safe-area-inset-top) + 8px) 14px 8px;border-bottom:1px solid var(--ln)}
.top{display:flex;align-items:center;gap:8px}
.top h1{flex:1;margin:0;font-size:19px;font-weight:700;text-align:center}
.top h1 small{display:block;font-size:12px;color:var(--mut);font-weight:500}
.nav{width:40px;height:40px;border-radius:12px;background:var(--card);font-size:20px;border:1px solid var(--ln)}
.sync{font-size:12px;color:var(--mut);text-align:center;margin-top:2px;min-height:15px}
.sync.err{color:var(--er);font-weight:600}
.chips{display:flex;gap:6px;overflow-x:auto;padding:8px 14px 2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;background:var(--card);border:1px solid var(--ln);border-radius:999px;padding:5px 10px;font-size:13px;font-weight:600;white-space:nowrap}
main{padding:6px 12px 20px}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.04em;color:var(--mut);margin:16px 4px 6px;display:flex;justify-content:space-between}
.per{display:flex;justify-content:space-between;align-items:center;width:100%;margin:12px 0 8px;padding:12px 14px;border-radius:12px;color:#fff;font-weight:800;font-size:15px;text-align:left}
.per.m{background:#d97706}.per.t{background:#1d4ed8}.per small{font-weight:600;font-size:12px;opacity:.95}
.card{background:var(--card);border:1px solid var(--ln);border-radius:14px;padding:10px 12px;margin-bottom:8px}
.card.esperando{background:var(--wabg)}.card.atendido{background:var(--okbg)}.card.faltou{background:var(--erbg)}.card.cancelado{opacity:.55}
.row1{display:flex;gap:10px;align-items:flex-start}
.hora{font-size:18px;font-weight:700;min-width:52px}
.who{flex:1;min-width:0}
.pac{font-weight:650;word-break:break-word}
.ex{font-size:13px;color:var(--mut);margin-top:2px}
.obs{font-size:12px;color:var(--mut);margin-top:3px;font-style:italic}
.tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px}
.tag{font-size:11px;font-weight:700;padding:2px 7px;border-radius:7px;background:var(--chip)}
.tag.urg{background:#dc2626;color:#fff}.tag.pref{background:#dbeafe;color:#1e40af}.tag.part{background:#fae8ff;color:#86198f}.tag.sus{background:#fee2e2;color:#991b1b}.tag.enc{background:#fef3c7;color:#92400e}
@media (prefers-color-scheme:dark){.tag.pref{background:#1e3a8a;color:#bfdbfe}.tag.part{background:#581c87;color:#f5d0fe}.tag.sus{background:#7f1d1d;color:#fecaca}.tag.enc{background:#78350f;color:#fde68a}}
.st{font-size:12px;font-weight:700;padding:3px 8px;border-radius:8px;white-space:nowrap;background:var(--chip)}
.st.s30{background:#fef08a;color:#713f12}.st.s45{background:#fed7aa;color:#7c2d12}.st.s60{background:#fecaca;color:#7f1d1d}
.st.ok{background:#bbf7d0;color:#14532d}.st.fal{background:#fecdd3;color:#881337}
.acts{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-top:9px}
.b{border-radius:10px;padding:9px 4px;font-weight:700;font-size:14px;border:1px solid var(--ln);background:var(--bg)}
.b.on-chegou{background:#fde68a;color:#713f12;border-color:#f59e0b}
.b.on-atend{background:#86efac;color:#14532d;border-color:#16a34a}
.b.on-falta{background:#fda4af;color:#881337;border-color:#e11d48}
.vazio{text-align:center;color:var(--mut);padding:30px 10px}
.fab{position:fixed;right:16px;bottom:calc(76px + env(safe-area-inset-bottom));width:56px;height:56px;border-radius:50%;background:var(--pri);color:#fff;font-size:28px;box-shadow:0 6px 18px rgba(0,0,0,.25);z-index:6}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:7;display:grid;grid-template-columns:repeat(6,1fr);background:var(--card);border-top:1px solid var(--ln);padding-bottom:env(safe-area-inset-bottom)}
.tabs button{padding:8px 0 6px;font-size:11px;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:2px}
.tabs button b{font-size:20px;font-weight:400}
.tabs button.on{color:var(--pri);font-weight:700}
.sheetbg{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:20;display:none}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;background:var(--card);border-radius:18px 18px 0 0;padding:14px 16px calc(18px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto;transform:translateY(105%);transition:transform .2s}
.sheet.open{transform:none}
.sheet h3{margin:4px 0 12px;font-size:17px}
.sheet label{display:block;font-size:12px;color:var(--mut);margin:10px 0 4px}
.btnp{width:100%;padding:13px;border-radius:12px;background:var(--pri);color:#fff;font-weight:700;margin-top:14px}
.btns{width:100%;padding:12px;border-radius:12px;background:var(--bg);border:1px solid var(--ln);font-weight:600;margin-top:8px}
.btnd{width:100%;padding:12px;border-radius:12px;color:var(--er);border:1px solid var(--er);font-weight:600;margin-top:8px}
.tl{font-size:14px;margin:4px 0}
.tl span{color:var(--mut)}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl td,.tbl th{padding:8px 6px;border-bottom:1px solid var(--ln);text-align:left}
.tbl th{font-size:11px;text-transform:uppercase;color:var(--mut)}
.tbl tr.hoje td{font-weight:700}
.num{text-align:right!important}
.chip.pdf{background:var(--pri);color:#fff;border-color:var(--pri)}
.chk{display:flex;align-items:center;gap:8px;margin-top:12px;font-size:15px}.chk input{width:22px;height:22px}
.btnu{width:100%;padding:12px;border-radius:12px;background:#dc2626;color:#fff;font-weight:700;margin-top:8px}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.kpi{background:var(--card);border:1px solid var(--ln);border-radius:12px;padding:10px}
.kpi b{display:block;font-size:22px}.kpi span{font-size:12px;color:var(--mut)}
.bar{height:7px;border-radius:4px;background:var(--chip);margin-top:4px;overflow:hidden}.bar i{display:block;height:100%;background:var(--er)}
.doc{display:flex;align-items:center;gap:10px;padding:12px;background:var(--card);border:1px solid var(--ln);border-radius:12px;margin-bottom:8px;text-decoration:none;color:var(--tx)}
.doc small{color:var(--mut);display:block}
.login{max-width:420px;margin:40px auto;padding:0 18px}
.login h1{font-size:24px;margin:0 0 6px}
.login p{color:var(--mut);margin:0 0 14px}
.msg{margin-top:10px;font-size:14px;color:var(--er)}
.note{font-size:12px;color:var(--mut);margin-top:12px}
.toast{position:fixed;left:50%;bottom:calc(140px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#0f172a;color:#fff;padding:10px 14px;border-radius:12px;font-size:14px;z-index:30;display:none;max-width:90vw}
</style>
</head>
<body>
<div id="app"></div>
<div class="sheetbg" id="sheetbg"></div>
<div class="sheet" id="sheet"></div>
<div class="toast" id="toast"></div>
<script>
'use strict';
// =====================================================================
// Agenda US — app web (PWA) para iPhone sobre o mesmo Supabase da Agenda.
// NADA de endereço do banco, chave ou dado de paciente no código: o endereço
// e a chave pública são digitados uma vez no aparelho; os dados só chegam
// com login (RLS = authenticated). Grava com PATCH por id (só os campos da
// ação), para não sobrescrever o que os PCs/integração PACS gravaram.
// =====================================================================
const VERSAO = '1.3.0';
const K = { cfg: 'agapp_cfg_v1', ses: 'agapp_sessao_v1', cache: 'agapp_cache_v1', fila: 'agapp_fila_v1', tab: 'agapp_tab_v1' };
const TABELA = 'agenda_exames';
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const ls = { get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } }, set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* cheio */ } }, del(k) { try { localStorage.removeItem(k); } catch (e) { /* ok */ } } };
const pad = n => String(n).padStart(2, '0');
const isoDia = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const hojeIso = () => isoDia(new Date());
const DIAS = ['dom', 'seg', 'ter', 'qua', 'qui', 'sex', 'sáb'];
const fmtDia = iso => { const [y, m, d] = iso.split('-').map(Number); const dt = new Date(y, m - 1, d); return `${DIAS[dt.getDay()]} ${pad(d)}/${pad(m)}`; };
const somaDias = (iso, n) => { const [y, m, d] = iso.split('-').map(Number); return isoDia(new Date(y, m - 1, d + n)); };
const hm = iso => { if (!iso) return '--:--'; const d = new Date(iso); return isNaN(d) ? '--:--' : `${pad(d.getHours())}:${pad(d.getMinutes())}`; };
const normTime = h => { const p = String(h || '').trim().replace(/[hH.]/g, ':').split(':'); return `${(p[0] || '0').replace(/\D/g, '').padStart(2, '0').slice(-2)}:${(p[1] || '00').replace(/\D/g, '').padEnd(2, '0').slice(0, 2)}`; };
const normText = s => String(s == null ? '' : s).replace(/\s+/g, ' ').trim().toUpperCase();
const normName = s => String(s == null ? '' : s).normalize('NFD').replace(/[̀-ͯ]/g, '').toUpperCase().replace(/[^A-Z ]/g, ' ').replace(/\s+/g, ' ').trim();
const minutos = (a, b) => { if (!a) return null; const d = ((b ? new Date(b) : new Date()) - new Date(a)); return d < 0 ? 0 : Math.floor(d / 60000); };
const fmtMin = m => m == null || isNaN(m) ? '–' : m < 60 ? `${m}m` : `${Math.floor(m / 60)}h${pad(m % 60)}`;
const slaCls = m => m == null ? '' : m >= 60 ? 's60' : m >= 45 ? 's45' : m >= 30 ? 's30' : '';
const proc = r => Math.max(r.qtd_exames || 1, r.pacs_qtd_exames || 1);
const chavePac = r => r.pacs_paciente_id > 0 ? 'p' + r.pacs_paciente_id : 'n' + normName(r.paciente);
function normConvenio(c) {
    const u = normText(c).normalize('NFD').replace(/[̀-ͯ]/g, '');
    if (!u) return 'NÃO INFORMADO';
    if (u.startsWith('PREFEITURA')) return 'PREFEITURA';
    if (/^SUS\b/.test(u)) return normText(c);
    if (/^SER[PF][A-Z]*([ -]|$)/.test(u)) return 'SERPRAM';
    if (/^IPSEN?MG/.test(u)) return 'IPSEMG';
    if (/^IPSM/.test(u)) return 'IPSM (PM)';
    if (/^UNIMED INTERC/.test(u)) return 'UNIMED INTERCÂMBIO';
    if (/^UNIMED( SUL.*)?$/.test(u)) return 'UNIMED SUL MINEIRA';
    if (/^SPA SAUDE/.test(u)) return 'SPA SAÚDE';
    if (/^BRADESCO/.test(u)) return 'BRADESCO';
    if (/^CARTAO DESC/.test(u)) return 'CARTÃO DESCONTO';
    return normText(c);
}
function toast(t, ms = 2600) { const el = $('#toast'); el.textContent = t; el.style.display = 'block'; clearTimeout(toast.t); toast.t = setTimeout(() => { el.style.display = 'none'; }, ms); }

// ---------------------------------------------------------------- estado
const S = { tab: ls.get(K.tab, 'agenda'), dia: hojeIso(), linhas: [], carregando: false, erro: '', rt: 'off', ultima: 0, per: { m: false, t: false } }; // per: períodos começam recolhidos

// ---------------------------------------------------------------- configuração e sessão
function cfg() { const c = ls.get(K.cfg, null); return c && c.url && c.key ? c : null; }
function salvarCfg(url, key) {
    let u = String(url || '').trim().replace(/^["']|["']$/g, '');
    if (u && !/^https?:\/\//i.test(u)) u = 'https://' + u;
    try { u = new URL(u).origin; } catch (e) { throw new Error('Endereço do projeto inválido.'); }
    const k = String(key || '').replace(/\s+/g, '');
    if (!k) throw new Error('Informe a chave pública (publishable/anon).');
    ls.set(K.cfg, { url: u, key: k });
}
function sessao() { return ls.get(K.ses, null); }
function gravarSessao(j) { const s = { access_token: j.access_token, refresh_token: j.refresh_token, expires_at: j.expires_at || Math.floor(Date.now() / 1000) + (j.expires_in || 3600), email: (j.user && j.user.email) || (sessao() || {}).email || '' }; ls.set(K.ses, s); return s; }
async function authPost(caminho, corpo) {
    const c = cfg();
    const r = await fetch(`${c.url}/auth/v1/${caminho}`, { method: 'POST', headers: { apikey: c.key, 'content-type': 'application/json' }, body: JSON.stringify(corpo) });
    let j = {}; try { j = await r.json(); } catch (e) { /* vazio */ }
    return { status: r.status, json: j };
}
async function entrar(email, senha) {
    const r = await authPost('token?grant_type=password', { email: String(email || '').trim(), password: String(senha || '') });
    if (r.status === 200 && r.json.access_token) return gravarSessao(r.json);
    const cod = r.json.error_code || r.json.error || '';
    if (cod === 'invalid_credentials' || cod === 'invalid_grant') throw new Error('E-mail ou senha incorretos.');
    throw new Error(`Login recusado (HTTP ${r.status}).`);
}
let renovando = null;
function renovar() {
    if (renovando) return renovando;
    renovando = (async () => {
        const s = sessao(); if (!s) return null;
        const r = await authPost('token?grant_type=refresh_token', { refresh_token: s.refresh_token });
        if (r.status === 200 && r.json.access_token) { const n = gravarSessao(r.json); rtToken(n.access_token); return n; }
        if (r.status === 400 || r.status === 401 || r.status === 403) { sair(true); throw new Error('Sessão encerrada. Entre de novo.'); }
        throw new Error(`HTTP ${r.status} ao renovar a sessão`);
    })().finally(() => { renovando = null; });
    return renovando;
}
async function token() {
    let s = sessao(); if (!s) throw new Error('sem login');
    if (s.expires_at - Date.now() / 1000 < 300) s = await renovar();
    if (!s) throw new Error('sem login');
    return s.access_token;
}
function sair(silencioso) {
    const s = sessao(), c = cfg();
    if (s && c) fetch(`${c.url}/auth/v1/logout`, { method: 'POST', headers: { apikey: c.key, Authorization: 'Bearer ' + s.access_token } }).catch(() => {});
    ls.del(K.ses); ls.del(K.cache); ls.del(K.fila);
    S.linhas = [];
    rtFechar();
    if (!silencioso) toast('Sessão encerrada e dados locais apagados.');
    render();
}

// ---------------------------------------------------------------- REST
async function api(caminho, metodo = 'GET', corpo, prefer, tentativa = 1) {
    const c = cfg(); if (!c) throw new Error('App não configurado');
    const h = { apikey: c.key, Authorization: 'Bearer ' + await token(), 'content-type': 'application/json' };
    if (prefer) h.Prefer = prefer;
    let r;
    try { r = await fetch(`${c.url}/rest/v1/${caminho}`, { method: metodo, headers: h, body: corpo ? JSON.stringify(corpo) : undefined }); }
    catch (e) { const er = new Error('Sem conexão'); er.rede = true; throw er; }
    if (r.status === 401 && tentativa === 1) { await renovar(); return api(caminho, metodo, corpo, prefer, 2); }
    const txt = await r.text();
    let j = null; try { j = txt ? JSON.parse(txt) : null; } catch (e) { j = txt; }
    if (!r.ok) { const er = new Error((j && (j.message || j.msg)) || `HTTP ${r.status}`); er.status = r.status; er.code = j && j.code; throw er; }
    return j;
}

// ---------------------------------------------------------------- fila offline (ações feitas sem rede)
function fila() { return ls.get(K.fila, []); }
function enfileirar(op) { const f = fila().filter(o => !(o.t === 'patch' && op.t === 'patch' && o.id === op.id)); if (op.t === 'patch') { const ant = fila().find(o => o.t === 'patch' && o.id === op.id); if (ant) op.campos = Object.assign({}, ant.campos, op.campos); } f.push(op); ls.set(K.fila, f); }
let enviando = false;
async function enviarFila() {
    if (enviando || !fila().length || !sessao()) return;
    enviando = true;
    try {
        while (fila().length) {
            const op = fila()[0];
            if (op.t === 'patch') await api(`${TABELA}?id=eq.${op.id}`, 'PATCH', op.campos, 'return=minimal');
            else if (op.t === 'insert') { try { await api(TABELA, 'POST', op.linha, 'return=minimal'); } catch (e) { if (e.status !== 409) throw e; } }
            else if (op.t === 'delete') await api(`${TABELA}?id=eq.${op.id}`, 'DELETE', null, 'return=minimal');
            ls.set(K.fila, fila().slice(1));
        }
        S.erro = '';
    } catch (e) { S.erro = e.rede ? 'Sem conexão — as ações ficam guardadas e vão quando a internet voltar.' : 'Erro ao gravar: ' + e.message; }
    finally { enviando = false; pintarSync(); }
}

// ---------------------------------------------------------------- leitura
async function carregarDia(dia = S.dia, silencioso) {
    if (!sessao()) return;
    if (!silencioso) { S.carregando = true; pintarSync(); }
    try {
        await enviarFila();
        const d = await api(`${TABELA}?data_agenda=eq.${dia}&select=*&order=hora.asc,id.asc`);
        if (dia !== S.dia) return;
        // ações ainda na fila prevalecem sobre a leitura
        const pend = {}; fila().forEach(o => { if (o.t === 'patch') pend[o.id] = Object.assign(pend[o.id] || {}, o.campos); });
        S.linhas = (d || []).map(r => pend[r.id] ? Object.assign({}, r, pend[r.id]) : r);
        S.erro = ''; S.ultima = Date.now();
        const cache = ls.get(K.cache, {}); cache[dia] = S.linhas;
        const dias = Object.keys(cache).sort(); while (dias.length > 7) delete cache[dias.shift()]; // guarda só os últimos dias abertos
        ls.set(K.cache, cache);
    } catch (e) {
        if (e.message === 'sem login') return render();
        const cache = ls.get(K.cache, {});
        if (cache[dia] && dia === S.dia && !S.linhas.length) S.linhas = cache[dia];
        S.erro = e.rede ? 'Sem conexão — mostrando a última cópia deste dia.' : 'Erro ao ler a agenda: ' + e.message;
    } finally { S.carregando = false; if (S.tab === 'agenda') pintarAgenda(); pintarSync(); }
}

// ---------------------------------------------------------------- ações (mesmas regras da Agenda dos PCs)
function aplicar(id, fn) {
    const r = S.linhas.find(x => x.id === id); if (!r) return;
    if (id < 0) { toast('Encaixe ainda não enviado: aguarde a conexão.'); return; }
    const campos = fn(r); if (!campos) return;
    Object.assign(r, campos);
    pintarAgenda();
    enfileirar({ t: 'patch', id, campos });
    enviarFila();
    if (navigator.vibrate) navigator.vibrate(10);
}
const agoraIso = () => new Date().toISOString();
function acaoChegou(id) { aplicar(id, r => r.status !== 'esperando'
    ? { status: 'esperando', chegou_em: agoraIso(), chegada_fonte: 'manual', atendido_em: null, atendido_fonte: null, tempo_espera_min: null }
    : { status: 'pendente', chegou_em: null, chegada_fonte: null, atendido_em: null, atendido_fonte: null, tempo_espera_min: null }); }
function acaoAtend(id) { aplicar(id, r => {
    if (r.status === 'atendido') return { status: r.chegou_em ? 'esperando' : 'pendente', atendido_em: null, atendido_fonte: null, tempo_espera_min: null };
    const n = agoraIso(); return { status: 'atendido', atendido_em: n, atendido_fonte: 'manual', tempo_espera_min: r.chegou_em ? minutos(r.chegou_em, n) : null };
}); }
function acaoFalta(id) { aplicar(id, r => r.status === 'faltou'
    ? { status: 'pendente' }
    : { status: 'faltou', chegou_em: null, chegada_fonte: null, atendido_em: null, atendido_fonte: null, tempo_espera_min: null }); }
function acaoUrgente(id) { aplicar(id, r => ({ urgente: !r.urgente, urgente_fonte: 'manual' })); }
async function remover(id) {

const RT = { ws: null, ref: 0, hb: null, retry: 0, timer: null, last: 0, join: null, deb: null };
const RT_TOPIC = 'realtime:agenda-app';

async function rtConectar() {
    const c = cfg(); if (!c || !sessao() || document.hidden) return;
    if (RT.ws && RT.ws.readyState <= 1) return;
    clearTimeout(RT.timer);
    let tk; try { tk = await token(); } catch (e) { return; }
    const ws = new WebSocket(`${c.url.replace(/^http/i, 'ws')}/realtime/v1/websocket?apikey=${encodeURIComponent(c.key)}&vsn=1.0.0`);
    RT.ws = ws; S.rt = 'conectando'; pintarSync();

        RT.last = Date.now(); RT.join = String(++RT.ref);
        rtSend({ topic: RT_TOPIC, event: 'phx_join', ref: RT.join, join_ref: RT.join, payload: { access_token: tk, config: { broadcast: { self: false }, presence: { key: '' }, postgres_changes: [{ event: '*', schema: 'public', table: TABELA }] } } });
        clearInterval(RT.hb);
        RT.hb = setInterval(() => { if (Date.now() - RT.last > 75000) { try { ws.close(); } catch (e) { /* ok */ } return; } rtSend({ topic: 'phoenix', event: 'heartbeat', payload: {}, ref: String(++RT.ref) }); }, 25000);
    };

        if (!m || m.topic !== RT_TOPIC) return;
        if (m.event === 'phx_reply' && m.ref === RT.join) { if (m.payload && m.payload.status === 'ok') { S.rt = 'on'; RT.retry = 0; } else { S.rt = 'falhou'; try { ws.close(); } catch (e) { /* ok */ } } pintarSync(); return; }
        if (m.event === 'postgres_changes') {
            const d = m.payload && m.payload.data; if (!d) return;
            const rec = d.record || d.old_record || {};
            if (d.type === 'DELETE' || !rec.data_agenda || rec.data_agenda === S.dia) { clearTimeout(RT.deb); RT.deb = setTimeout(() => carregarDia(S.dia, true), 900); }
        }
        if (m.event === 'phx_error' || m.event === 'phx_close') { try { ws.close(); } catch (e) { /* ok */ } }
    };
    ws.onclose = () => { if (RT.ws === ws) { RT.ws = null; clearInterval(RT.hb); } if (S.rt !== 'falhou') S.rt = 'off'; pintarSync(); if (sessao() && !document.hidden) { RT.timer = setTimeout(rtConectar, Math.min(300000, 3000 * Math.pow(2, RT.retry++))); } };
}

    const c = cfg() || {};
    return `<div class="login"><h1>📅 Agenda US</h1><p>Mesma agenda dos PCs, no iPhone.</p><form id="flog">
${cfg() ? '' : `<label class="note">Endereço do projeto Supabase (Project URL)</label><input name="url" inputmode="url" autocapitalize="off" autocorrect="off" placeholder="https://…supabase.co" value="${esc(c.url || '')}">
<label class="note">Chave pública (publishable/anon)</label><input name="key" autocapitalize="off" autocorrect="off" placeholder="sb_publishable_…">`}
<label class="note">E-mail</label><input name="email" type="email" autocomplete="username" autocapitalize="off">
<label class="note">Senha</label><input name="senha" type="password" autocomplete="current-password">
<button class="btnp" type="submit">Entrar</button>${cfg() ? '<button class="btns" type="button" id="trocar">Trocar endereço/chave do projeto</button>' : ''}
<div class="msg" id="lmsg"></div></form>
<div class="note">Endereço e chave são os mesmos do ⚙️ API da Agenda nos PCs. A senha não fica gravada.</div></div>`;
}
function ligarLogin() {
    const f = $('#flog');
    const tr = $('#trocar'); if (tr) tr.onclick = () => { ls.del(K.cfg); render(); };
    f.onsubmit = async e => {
        e.preventDefault(); const m = $('#lmsg'); m.textContent = '';
        try {
            if (!cfg()) salvarCfg(f.url.value, f.key.value);
            await entrar(f.email.value, f.senha.value);
            render(); carregarDia(S.dia); rtConectar();
        } catch (er) { m.textContent = er.message || String(er); }
    };
}

// ---------------------------------------------------------------- ciclo de vida
$('#sheetbg').onclick = fecharSheet;
document.addEventListener('visibilitychange', () => {
    if (document.hidden) { rtFechar(); return; }
    if (!sessao()) return;
    if (S.dia !== hojeIso() && Date.now() - S.ultima > 6 * 3600e3) S.dia = hojeIso(); // reabriu no dia seguinte
    carregarDia(S.dia, true); rtConectar();
});
window.addEventListener('online', () => { enviarFila(); carregarDia(S.dia, true); rtConectar(); });
setInterval(() => { if (!document.hidden && S.tab === 'agenda' && S.linhas.some(r => r.status === 'esperando')) pintarAgenda(); }, 30000); // cronômetro de espera
setInterval(() => { if (!document.hidden && sessao() && S.rt !== 'on') carregarDia(S.dia, true); }, 60000); // reserva sem tempo real
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
S.linhas = (ls.get(K.cache, {})[S.dia]) || [];
render();
if (sessao()) { carregarDia(S.dia); rtConectar(); }
</script>
</body>
